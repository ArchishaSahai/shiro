name: Bug report
description: Report something that is not working as expected.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproduction you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shiro version
    validations:
      required: false
